<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FDF6EE"/>
      <stop offset="100%" stop-color="#F1C6D0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg3)"/>

  <!-- short brunette girl, extra-round rosy cheeks -->
  <g transform="translate(320 260)">
    <ellipse cx="0" cy="150" rx="40" ry="9" fill="#000" opacity="0.07"/>
    <!-- torso -->
    <path d="M-40 60 Q0 44 40 60 L48 150 Q0 166 -48 150 Z" fill="#F1C6D0"/>
    <!-- arms -->
    <rect x="-56" y="66" width="14" height="46" rx="7" fill="#F6DCC4" transform="rotate(12 -56 66)"/>
    <rect x="42" y="66" width="14" height="46" rx="7" fill="#F6DCC4" transform="rotate(-12 42 66)"/>
    <!-- neck -->
    <rect x="-9" y="26" width="18" height="18" fill="#F6DCC4"/>
    <!-- head, wider for big cheeks -->
    <ellipse cx="0" cy="-10" rx="44" ry="38" fill="#F6DCC4"/>
    <!-- long wavy brown hair -->
    <path d="M-42 -20 q-14 60 8 96 q0 -46 8 -70 z" fill="#3B2620"/>
    <path d="M42 -20 q14 60 -8 96 q0 -46 -8 -70 z" fill="#3B2620"/>
    <path d="M-42 -22 q4 -34 42 -34 q38 0 42 34 q-10 -16 -42 -16 q-32 0 -42 16 z" fill="#3B2620"/>
    <!-- big rosy cheeks -->
    <circle cx="-30" cy="4" r="18" fill="#F3A6B4" opacity="0.75"/>
    <circle cx="30" cy="4" r="18" fill="#F3A6B4" opacity="0.75"/>
    <!-- eyebrows -->
    <path d="M-20 -18 q8 -4 14 0 M6 -18 q8 -4 14 0" stroke="#3B2620" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- brown eyes -->
    <ellipse cx="-13" cy="-9" rx="5" ry="6" fill="#5A3A28"/>
    <ellipse cx="13" cy="-9" rx="5" ry="6" fill="#5A3A28"/>
    <circle cx="-11.5" cy="-11" r="1.4" fill="#fff"/>
    <circle cx="14.5" cy="-11" r="1.4" fill="#fff"/>
    <!-- nose + smile -->
    <path d="M0 -4 q3 5 0 8" stroke="#C99A6E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M-10 8 q10 8 20 0" stroke="#8C4A32" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <text x="320" y="120" font-family="Georgia, serif" font-weight="700" font-size="46" fill="#8C1F3B" text-anchor="middle">?</text>

  <!-- little bun / bread roll icon, bottom corner -->
  <g transform="translate(520 400)">
    <ellipse cx="0" cy="10" rx="46" ry="26" fill="#E7B84B"/>
    <path d="M-30 0 q30 -22 60 0" stroke="#C9A24B" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M-18 -4 q18 -14 36 0" stroke="#C9A24B" stroke-width="3" fill="none" opacity="0.7"/>
  </g>
</svg>
