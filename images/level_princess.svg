<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF0EE"/>
      <stop offset="100%" stop-color="#F1C6D0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bgP)"/>

  <!-- soft sparkles -->
  <g fill="#C9A24B" opacity="0.7">
    <text x="120" y="90" font-size="20">✦</text>
    <text x="500" y="120" font-size="16">✦</text>
    <text x="540" y="300" font-size="18">✦</text>
    <text x="90" y="330" font-size="14">✦</text>
    <text x="300" y="60" font-size="14">✦</text>
  </g>

  <!-- short brunette girl dressed as a princess -->
  <g transform="translate(320 280)">
    <ellipse cx="0" cy="150" rx="60" ry="10" fill="#000" opacity="0.08"/>

    <!-- big poofy ball gown skirt -->
    <path d="M-70 130 Q0 40 70 130 Q78 150 0 158 Q-78 150 -70 130 Z" fill="#8C1F3B"/>
    <path d="M-50 130 Q0 60 50 130 Q54 146 0 150 Q-54 146 -50 130 Z" fill="#B4483F" opacity="0.7"/>
    <path d="M-30 40 Q0 20 30 40 L38 90 Q0 100 -38 90 Z" fill="#8C1F3B"/>

    <!-- gold trim on bodice -->
    <path d="M-24 46 Q0 34 24 46" stroke="#C9A24B" stroke-width="3" fill="none"/>
    <path d="M-30 62 Q0 52 30 62" stroke="#C9A24B" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- arms -->
    <rect x="-46" y="46" width="12" height="40" rx="6" fill="#F6DCC4" transform="rotate(12 -46 46)"/>
    <rect x="34" y="46" width="12" height="40" rx="6" fill="#F6DCC4" transform="rotate(-12 34 46)"/>

    <!-- neck + head -->
    <rect x="-7" y="14" width="14" height="14" fill="#F6DCC4"/>
    <circle cx="0" cy="-6" r="26" fill="#F6DCC4"/>

    <!-- long brown hair, styled up with loose strands, princess-style -->
    <path d="M-26 -8 q-10 40 6 66 q-2 -34 4 -50 z" fill="#3B2620"/>
    <path d="M26 -8 q10 40 -6 66 q2 -34 -4 -50 z" fill="#3B2620"/>
    <path d="M-26 -10 q2 -26 26 -26 q24 0 26 26 q-8 -12 -26 -12 q-18 0 -26 12 z" fill="#3B2620"/>
    <path d="M-14 -30 q14 -14 28 0" stroke="#3B2620" stroke-width="4" fill="none" opacity="0.8"/>

    <!-- tiara -->
    <g transform="translate(0 -30)">
      <path d="M-20 4 L-12 -10 L-4 2 L0 -14 L4 2 L12 -10 L20 4 Z" fill="#E7B84B" stroke="#C9A24B" stroke-width="1"/>
      <circle cx="0" cy="-10" r="3.5" fill="#F1C6D0"/>
      <circle cx="-12" cy="-6" r="2.2" fill="#F1C6D0"/>
      <circle cx="12" cy="-6" r="2.2" fill="#F1C6D0"/>
    </g>

    <!-- eyebrows -->
    <path d="M-13 -8 q5 -3 9 0 M4 -8 q5 -3 9 0" stroke="#3B2620" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- brown eyes -->
    <ellipse cx="-8" cy="-1" rx="3.6" ry="4.6" fill="#5A3A28"/>
    <ellipse cx="8" cy="-1" rx="3.6" ry="4.6" fill="#5A3A28"/>
    <circle cx="-6.5" cy="-2.5" r="1.1" fill="#fff"/>
    <circle cx="9.5" cy="-2.5" r="1.1" fill="#fff"/>
    <!-- blush -->
    <circle cx="-15" cy="7" r="4" fill="#F3A6B4" opacity="0.6"/>
    <circle cx="15" cy="7" r="4" fill="#F3A6B4" opacity="0.6"/>
    <!-- smile -->
    <path d="M-6 11 q6 5 12 0" stroke="#8C4A32" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- little pearl necklace -->
    <path d="M-10 30 q10 8 20 0" stroke="#fff" stroke-width="3" fill="none" opacity="0.85"/>
  </g>

  <text x="320" y="110" font-family="Georgia, serif" font-weight="700" font-size="46" fill="#8C1F3B" text-anchor="middle">?</text>
</svg>
