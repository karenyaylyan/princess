<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A1220"/>
      <stop offset="100%" stop-color="#5E1327"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg5)"/>

  <!-- tall brunette man dressed as a count, embracing short brunette woman -->
  <g transform="translate(270 250)">
    <ellipse cx="10" cy="180" rx="70" ry="12" fill="#000" opacity="0.25"/>
    <!-- cape -->
    <path d="M-6 26 q-72 14 -58 168 q42 -28 70 -8 q12 -128 -12 -160 z" fill="#1B0A10" stroke="#C9A24B" stroke-width="2"/>
    <!-- legs -->
    <rect x="-14" y="150" width="16" height="50" rx="6" fill="#1B0A10"/>
    <rect x="10" y="150" width="16" height="50" rx="6" fill="#1B0A10"/>
    <!-- torso -->
    <rect x="-30" y="60" width="72" height="96" rx="20" fill="#2B1E22"/>
    <!-- arm around her -->
    <rect x="30" y="80" width="60" height="16" rx="8" fill="#2B1E22" transform="rotate(18 30 80)"/>
    <!-- other arm -->
    <rect x="-44" y="70" width="16" height="50" rx="8" fill="#2B1E22" transform="rotate(-8 -44 70)"/>
    <!-- neck + head -->
    <rect x="-8" y="24" width="16" height="16" fill="#E9C8A6"/>
    <circle cx="0" cy="0" r="30" fill="#E9C8A6"/>
    <!-- short dark hair, widow's peak -->
    <path d="M-30 -6 q-2 -32 30 -34 q32 2 30 34 q-6 -16 -30 -16 q-24 0 -30 16 z" fill="#1B0A10"/>
    <path d="M0 -36 l0 10" stroke="#1B0A10" stroke-width="4"/>
    <!-- eyebrows, slightly sharp for count look -->
    <path d="M-16 -8 q7 -6 12 -1 M4 -9 q7 -5 12 1" stroke="#1B0A10" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- brown eyes -->
    <ellipse cx="-9" cy="0" rx="4.2" ry="5.2" fill="#5A3A28"/>
    <ellipse cx="9" cy="0" rx="4.2" ry="5.2" fill="#5A3A28"/>
    <circle cx="-7.5" cy="-1.6" r="1.3" fill="#fff"/>
    <circle cx="10.5" cy="-1.6" r="1.3" fill="#fff"/>
    <!-- nose + smirk -->
    <path d="M0 2 v6" stroke="#C99A6E" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M-7 13 q7 4 14 -1" stroke="#8C4A32" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- bow tie -->
    <path d="M-14 46 l14 10 l14 -10 l0 14 l-14 10 l-14 -10 z" fill="#C9A24B"/>
    <!-- cape collar points -->
    <path d="M-30 60 l-14 -24 l20 6 z" fill="#1B0A10"/>
    <path d="M30 60 l14 -24 l-20 6 z" fill="#1B0A10"/>
  </g>

  <!-- short brunette woman, resting head on his shoulder -->
  <g transform="translate(390 275)">
    <ellipse cx="0" cy="150" rx="46" ry="10" fill="#000" opacity="0.25"/>
    <!-- dress -->
    <path d="M-34 46 Q0 32 34 46 L44 148 Q0 164 -44 148 Z" fill="#8C1F3B"/>
    <!-- arms -->
    <rect x="-52" y="52" width="14" height="46" rx="7" fill="#F1C6D0" transform="rotate(14 -52 52)"/>
    <rect x="40" y="52" width="14" height="46" rx="7" fill="#F1C6D0" transform="rotate(-14 40 52)"/>
    <!-- neck + head, slightly tilted -->
    <rect x="-9" y="14" width="18" height="16" fill="#F6DCC4"/>
    <g transform="rotate(-8)">
      <circle cx="0" cy="-4" r="27" fill="#F6DCC4"/>
      <!-- long wavy brown hair -->
      <path d="M-27 -12 q-12 46 6 76 q0 -36 6 -56 z" fill="#3B2620"/>
      <path d="M27 -12 q12 46 -6 76 q0 -36 -6 -56 z" fill="#3B2620"/>
      <path d="M-27 -14 q3 -28 27 -28 q24 0 27 28 q-8 -14 -27 -14 q-19 0 -27 14 z" fill="#3B2620"/>
      <!-- eyebrows -->
      <path d="M-14 -12 q6 -3 10 0 M4 -12 q6 -3 10 0" stroke="#3B2620" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- brown eyes, soft/closed-happy -->
      <path d="M-13 -5 q4 4 8 0" stroke="#3B2620" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M5 -5 q4 4 8 0" stroke="#3B2620" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <!-- blush -->
      <circle cx="-15" cy="4" r="4" fill="#F3A6B4" opacity="0.65"/>
      <circle cx="15" cy="4" r="4" fill="#F3A6B4" opacity="0.65"/>
      <!-- smile -->
      <path d="M-7 9 q7 6 14 0" stroke="#8C4A32" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- small hearts drifting between them -->
  <g fill="#C9A24B" opacity="0.9">
    <text x="335" y="180" font-size="20">♥</text>
    <text x="315" y="150" font-size="13">♥</text>
    <text x="358" y="140" font-size="15">♥</text>
  </g>

  <text x="270" y="130" font-family="Georgia, serif" font-weight="700" font-size="44" fill="#C9A24B" text-anchor="middle">?</text>
</svg>
