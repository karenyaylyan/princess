<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF3EA"/>
      <stop offset="100%" stop-color="#F1E1CB"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg2)"/>
  <rect x="0" y="400" width="640" height="80" fill="#E9D2AE"/>

  <!-- tower of little sauce cups, built to roughly her height -->
  <g transform="translate(400 0)">
    <g transform="translate(0 360)">
      <g transform="translate(-96 0)"><rect width="26" height="20" rx="4" fill="#B4483F"/></g>
      <g transform="translate(-64 0)"><rect width="26" height="20" rx="4" fill="#8C1F3B"/></g>
      <g transform="translate(-32 0)"><rect width="26" height="20" rx="4" fill="#C9A24B"/></g>
      <g transform="translate(0 0)"><rect width="26" height="20" rx="4" fill="#B4483F"/></g>
      <g transform="translate(32 0)"><rect width="26" height="20" rx="4" fill="#8C1F3B"/></g>
      <g transform="translate(64 0)"><rect width="26" height="20" rx="4" fill="#C9A24B"/></g>
    </g>
    <g transform="translate(0 336)">
      <g transform="translate(-80 0)"><rect width="26" height="20" rx="4" fill="#C9A24B"/></g>
      <g transform="translate(-48 0)"><rect width="26" height="20" rx="4" fill="#B4483F"/></g>
      <g transform="translate(-16 0)"><rect width="26" height="20" rx="4" fill="#8C1F3B"/></g>
      <g transform="translate(16 0)"><rect width="26" height="20" rx="4" fill="#C9A24B"/></g>
      <g transform="translate(48 0)"><rect width="26" height="20" rx="4" fill="#B4483F"/></g>
    </g>
    <g transform="translate(0 312)">
      <g transform="translate(-64 0)"><rect width="26" height="20" rx="4" fill="#8C1F3B"/></g>
      <g transform="translate(-32 0)"><rect width="26" height="20" rx="4" fill="#C9A24B"/></g>
      <g transform="translate(0 0)"><rect width="26" height="20" rx="4" fill="#B4483F"/></g>
      <g transform="translate(32 0)"><rect width="26" height="20" rx="4" fill="#8C1F3B"/></g>
    </g>
    <g transform="translate(0 288)">
      <g transform="translate(-48 0)"><rect width="26" height="20" rx="4" fill="#B4483F"/></g>
      <g transform="translate(-16 0)"><rect width="26" height="20" rx="4" fill="#C9A24B"/></g>
      <g transform="translate(16 0)"><rect width="26" height="20" rx="4" fill="#8C1F3B"/></g>
    </g>
    <g transform="translate(0 264)">
      <g transform="translate(-32 0)"><rect width="26" height="20" rx="4" fill="#8C1F3B"/></g>
      <g transform="translate(0 0)"><rect width="26" height="20" rx="4" fill="#C9A24B"/></g>
    </g>
    <g transform="translate(0 240)">
      <g transform="translate(-16 0)"><rect width="26" height="20" rx="4" fill="#B4483F"/></g>
    </g>
  </g>
  <text x="400" y="200" font-family="Georgia, serif" font-weight="700" font-size="44" fill="#8C1F3B" text-anchor="middle">?</text>

  <!-- short brunette girl in a hardhat, standing for scale next to the tower -->
  <g transform="translate(200 260)">
    <ellipse cx="0" cy="150" rx="34" ry="8" fill="#000" opacity="0.08"/>
    <!-- legs -->
    <rect x="-16" y="100" width="12" height="50" rx="5" fill="#3B2620"/>
    <rect x="4" y="100" width="12" height="50" rx="5" fill="#3B2620"/>
    <!-- overalls/dress -->
    <path d="M-28 40 Q0 28 28 40 L34 105 Q0 118 -34 105 Z" fill="#F1C6D0"/>
    <!-- arms -->
    <rect x="-40" y="46" width="12" height="42" rx="6" fill="#F6DCC4" transform="rotate(10 -40 46)"/>
    <rect x="28" y="46" width="12" height="42" rx="6" fill="#F6DCC4" transform="rotate(-10 28 46)"/>
    <!-- neck + head -->
    <rect x="-7" y="14" width="14" height="14" fill="#F6DCC4"/>
    <circle cx="0" cy="-4" r="26" fill="#F6DCC4"/>
    <!-- long brown hair, framing face, flowing to shoulders -->
    <path d="M-26 -6 q-10 40 6 66 q-2 -34 4 -50 z" fill="#3B2620"/>
    <path d="M26 -6 q10 40 -6 66 q2 -34 -4 -50 z" fill="#3B2620"/>
    <path d="M-26 -8 q2 -26 26 -26 q24 0 26 26 q-8 -12 -26 -12 q-18 0 -26 12 z" fill="#3B2620"/>
    <!-- hardhat -->
    <g transform="translate(0 -22)">
      <ellipse cx="0" cy="8" rx="30" ry="7" fill="#C9A24B"/>
      <path d="M-26 8 a26 22 0 0 1 52 0 z" fill="#E7B84B"/>
      <rect x="-26" y="4" width="52" height="6" fill="#C9A24B"/>
    </g>
    <!-- eyebrows -->
    <path d="M-13 -8 q5 -3 9 0 M4 -8 q5 -3 9 0" stroke="#3B2620" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- brown eyes -->
    <ellipse cx="-8" cy="-1" rx="3.4" ry="4.4" fill="#5A3A28"/>
    <ellipse cx="8" cy="-1" rx="3.4" ry="4.4" fill="#5A3A28"/>
    <circle cx="-7" cy="-2.5" r="1" fill="#fff"/>
    <circle cx="9" cy="-2.5" r="1" fill="#fff"/>
    <!-- blush -->
    <circle cx="-15" cy="6" r="4" fill="#F3A6B4" opacity="0.6"/>
    <circle cx="15" cy="6" r="4" fill="#F3A6B4" opacity="0.6"/>
    <!-- smile -->
    <path d="M-6 10 q6 5 12 0" stroke="#8C4A32" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
