<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCEFE1"/>
      <stop offset="100%" stop-color="#F6DCC4"/>
    </linearGradient>
    <linearGradient id="water1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9FC6D8"/>
      <stop offset="100%" stop-color="#6FA6BC"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#sky1)"/>
  <circle cx="540" cy="80" r="42" fill="#F1C879" opacity="0.9"/>
  <path d="M0 220 Q160 195 320 225 T640 215 V480 H0 Z" fill="#E9D2AE"/>
  <path d="M0 300 Q160 270 320 300 T640 285 V480 H0 Z" fill="url(#water1)"/>
  <path d="M0 340 Q160 315 320 345 T640 330" stroke="#DDEFF5" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M0 380 Q160 355 320 385 T640 370" stroke="#DDEFF5" stroke-width="4" fill="none" opacity="0.4"/>

  <!-- distant prison silhouette, small, top right -->
  <g transform="translate(555 175)" opacity="0.5">
    <rect x="-24" y="-30" width="48" height="55" rx="4" fill="#8C7B70"/>
    <rect x="-16" y="-24" width="6" height="42" fill="#5E1327" opacity="0.5"/>
    <rect x="-4" y="-24" width="6" height="42" fill="#5E1327" opacity="0.5"/>
    <rect x="8" y="-24" width="6" height="42" fill="#5E1327" opacity="0.5"/>
  </g>

  <!-- little girl, riverside, small figure -->
  <g transform="translate(110 300)">
    <ellipse cx="0" cy="118" rx="30" ry="7" fill="#000" opacity="0.08"/>
    <!-- legs -->
    <rect x="-14" y="70" width="10" height="46" rx="4" fill="#F6DCC4"/>
    <rect x="4" y="70" width="10" height="46" rx="4" fill="#F6DCC4"/>
    <!-- dress -->
    <path d="M-26 30 Q0 18 26 30 L34 90 Q0 104 -34 90 Z" fill="#F1C6D0"/>
    <!-- arms -->
    <rect x="-34" y="34" width="10" height="38" rx="5" fill="#F6DCC4" transform="rotate(18 -34 34)"/>
    <rect x="24" y="34" width="10" height="38" rx="5" fill="#F6DCC4" transform="rotate(-10 24 34)"/>
    <!-- head -->
    <circle cx="0" cy="0" r="22" fill="#F6DCC4"/>
    <!-- hair, twin pigtail style -->
    <path d="M-22 -6 q-14 4 -10 22 q10 -2 10 -14 z" fill="#4A2C2A"/>
    <path d="M22 -6 q14 4 10 22 q-10 -2 -10 -14 z" fill="#4A2C2A"/>
    <path d="M-22 -4 q4 -22 22 -22 q18 0 22 22 q-6 -10 -22 -10 q-16 0 -22 10 z" fill="#4A2C2A"/>
    <!-- sad face -->
    <ellipse cx="-7" cy="0" rx="3" ry="4" fill="#5A3A28"/>
    <ellipse cx="7" cy="0" rx="3" ry="4" fill="#5A3A28"/>
    <path d="M-11 -7 q4 -3 7 0 M4 -7 q4 -3 7 0" stroke="#3B2620" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M-6 10 q6 -4 12 0" stroke="#B4483F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="-10" cy="6" r="4" fill="#9FC6D8" opacity="0.7"/>
    <circle cx="10" cy="6" r="4" fill="#9FC6D8" opacity="0.7"/>
  </g>

  <!-- ball floating in the water -->
  <g transform="translate(300 335)">
    <circle r="16" fill="#B4483F"/>
    <circle r="16" fill="none" stroke="#5E1327" stroke-width="2.5"/>
    <path d="M-16 0 h32 M0 -16 v32" stroke="#5E1327" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- tall brunette man, arriving, holding the ball out -->
  <g transform="translate(460 260)">
    <ellipse cx="0" cy="168" rx="42" ry="9" fill="#000" opacity="0.1"/>
    <!-- legs -->
    <rect x="-22" y="108" width="16" height="62" rx="6" fill="#2B1E22"/>
    <rect x="6" y="108" width="16" height="62" rx="6" fill="#2B1E22"/>
    <!-- torso -->
    <rect x="-32" y="40" width="64" height="76" rx="16" fill="#8C1F3B"/>
    <!-- extended arm holding ball -->
    <rect x="-70" y="55" width="42" height="16" rx="8" fill="#F0D0AE" transform="rotate(-8 -70 55)"/>
    <circle cx="-72" cy="60" r="15" fill="#B4483F" stroke="#5E1327" stroke-width="2"/>
    <!-- other arm -->
    <rect x="26" y="48" width="16" height="42" rx="8" fill="#8C1F3B" transform="rotate(14 26 48)"/>
    <!-- neck + head -->
    <rect x="-8" y="18" width="16" height="16" fill="#F0D0AE"/>
    <circle cx="0" cy="0" r="28" fill="#F0D0AE"/>
    <!-- short dark hair -->
    <path d="M-28 -4 q-2 -30 28 -32 q30 2 28 32 q-6 -14 -28 -14 q-22 0 -28 14 z" fill="#241713"/>
    <path d="M-28 -6 q-3 10 2 18" fill="#241713"/>
    <path d="M28 -6 q3 10 -2 18" fill="#241713"/>
    <!-- eyebrows -->
    <path d="M-15 -8 q6 -4 11 -1 M4 -9 q6 -3 11 1" stroke="#241713" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- brown eyes -->
    <ellipse cx="-9" cy="0" rx="4" ry="5" fill="#5A3A28"/>
    <ellipse cx="9" cy="0" rx="4" ry="5" fill="#5A3A28"/>
    <circle cx="-8" cy="-1.5" r="1.2" fill="#fff"/>
    <circle cx="10" cy="-1.5" r="1.2" fill="#fff"/>
    <!-- nose + smile -->
    <path d="M0 2 v6" stroke="#C99A6E" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-7 12 q7 6 14 0" stroke="#8C4A32" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- question mark over the man -->
  <text x="460" y="150" font-family="Georgia, serif" font-weight="700" font-size="46" fill="#8C1F3B" text-anchor="middle">?</text>
</svg>
